// minecraft-api — NeoForge module.
// Thin entrypoint + platform adapter; all real work lives in the common module.

plugins {
    alias(libs.plugins.neoforge.moddev)
}

base {
    archivesName = 'minecraft-api-neoforge'
}

def minecraftVersion = libs.versions.minecraft.get()
def neoVersion = libs.versions.neoforge.get()

neoForge {
    version = neoVersion

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file(
                    providers.gradleProperty('mapiServerRunDir').getOrElse('run/server'))
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        mapi {
            sourceSet sourceSets.main
        }
    }
}

// Mod metadata lives in src/main/templates/META-INF/neoforge.mods.toml and is
// expanded at build time:
def replaceProperties = [
        mod_id                 : providers.gradleProperty('mapiModId').get(),
        mod_name               : providers.gradleProperty('mapiName').get(),
        mod_license            : providers.gradleProperty('mapiLicense').get(),
        mod_version            : project.version.toString(),
        minecraft_version_range: libs.versions.minecraftVersionRange.get(),
        neo_version            : neoVersion,
]
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

dependencies {
    implementation project(':common')
}

java {
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

// ---------------------------------------------------------------------------
// API-enabled dev runs (slice 0.7) — see fabric/build.gradle for the
// contract. Applied when `-PmapiApi` is present so plain runs stay untouched:
//
//   ./gradlew :neoforge:runServerApi -PmapiApi -PmapiApiPort=26002 \
//       -PmapiInstanceId=mx-neoforge-1 [-PmapiServerRunDir=...]
// ---------------------------------------------------------------------------

if (providers.gradleProperty('mapiApi').isPresent()) {
    def apiPort = providers.gradleProperty('mapiApiPort').getOrElse('25586')
    def instanceId = providers.gradleProperty('mapiInstanceId').getOrElse("mapi-${apiPort}")
    tasks.withType(JavaExec).configureEach {
        environment 'MAPI_HTTP_ENABLED', 'true'
        environment 'MAPI_HTTP_PORT', apiPort
        environment 'MAPI_INSTANCE_ID', instanceId
    }
}

tasks.register('runServerApi') {
    group = 'mapi'
    description = "Runs the dev server with the local HTTP API enabled (set -PmapiApi; see build.gradle)."
    dependsOn tasks.named('runServer')
}

tasks.register('runClientApi') {
    group = 'mapi'
    description = "Runs the dev client with the local HTTP API enabled (set -PmapiApi; see build.gradle)."
    dependsOn tasks.named('runClient')
}

// Bundle the shared common classes/resources into the distributable jar.
tasks.named('jar', Jar).configure {
    from(project(':common').sourceSets.main.output)
}