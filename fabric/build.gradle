// minecraft-api — Fabric loader module.
// Thin entrypoint + platform adapter; all shared logic lives in :common.

plugins {
    alias(libs.plugins.fabric.loom)
}

base {
    archivesName = 'minecraft-api-fabric'
}

def minecraftVersion = libs.versions.minecraft.get()
def fabricLoaderVersion = libs.versions.fabric.loader.get()
def fabricApiVersion = libs.versions.fabric.api.get()

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation project(':common')
}

// Development run directories are kept separate per environment. The server
// run dir can be overridden (e.g. by scripts/server-smoke.sh):
def serverRunDir = providers.gradleProperty('mapiServerRunDir').getOrElse('run/server')

loom {
    splitEnvironmentSourceSets()
    mods {
        mapi {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            client()
            runDir 'run/client'
        }
        server {
            server()
            runDir serverRunDir
        }
    }
}

// ---------------------------------------------------------------------------
// API-enabled dev runs (slice 0.7). Applied when `-PmapiApi` is present, so a
// plain `runServer`/`runClient` stays untouched. The token auto-generates into
// <runDir>/mcapi/token; discovery lands in <runDir>/mcapi/discovery.json.
//
//   ./gradlew :fabric:runServerApi -PmapiApi -PmapiApiPort=26001 \
//       -PmapiInstanceId=mx-fabric-1 [-PmapiServerRunDir=...]
// ---------------------------------------------------------------------------

if (providers.gradleProperty('mapiApi').isPresent()) {
    def apiPort = providers.gradleProperty('mapiApiPort').getOrElse('25586')
    def instanceId = providers.gradleProperty('mapiInstanceId').getOrElse("mapi-${apiPort}")
    tasks.withType(JavaExec).configureEach {
        environment 'MAPI_HTTP_ENABLED', 'true'
        environment 'MAPI_HTTP_PORT', apiPort
        environment 'MAPI_INSTANCE_ID', instanceId
    }
}

tasks.register('runServerApi') {
    group = 'mapi'
    description = "Runs the dev server with the local HTTP API enabled (set -PmapiApi; see build.gradle)."
    dependsOn tasks.named('runServer')
}

tasks.register('runClientApi') {
    group = 'mapi'
    description = "Runs the dev client with the local HTTP API enabled (set -PmapiApi; see build.gradle)."
    dependsOn tasks.named('runClient')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}

// Bundle the shared common classes/resources into this distributable jar
// (no remapping needed on Minecraft 26.x: the game ships unobfuscated).
// The client source set (split environment) is included too: Fabric Loader
// only loads client entrypoints on the physical client, and everything under
// dev.example.mapi.client.* is referenced exclusively from client code.
tasks.named('jar', Jar).configure {
    from(project(':common').sourceSets.main.output)
    from(sourceSets.client.output)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}