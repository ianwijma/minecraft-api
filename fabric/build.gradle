// minecraft-api — Fabric loader module.
// Thin entrypoint + platform adapter; all shared logic lives in :common.

plugins {
    alias(libs.plugins.fabric.loom)
}

base {
    archivesName = 'minecraft-api-fabric'
}

def minecraftVersion = libs.versions.minecraft.get()
def fabricLoaderVersion = libs.versions.fabric.loader.get()
def fabricApiVersion = libs.versions.fabric.api.get()

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation libs.fabric.loader
    implementation libs.fabric.api
    productionRuntimeMods libs.fabric.api
    implementation project(':common')
}

// Development run directories are kept separate per environment. The server
// run dir can be overridden (e.g. by scripts/server-smoke.sh):
def serverRunDir = providers.gradleProperty('mapiServerRunDir').getOrElse('run/server')
def clientRunDir = providers.gradleProperty('mapiClientRunDir').getOrElse('run/client')

loom {
    // Split main (both sides) from client-only code so dedicated servers
    // never receive Minecraft client classes (docs/architecture.md).
    splitEnvironmentSourceSets()
    mods {
        mapi {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            client()
            runDir clientRunDir
        }
        server {
            server()
            runDir serverRunDir
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    withSourcesJar()
}

// Bundle the shared common classes/resources into this distributable jar
// (no remapping needed on Minecraft 26.x: the game ships unobfuscated).
tasks.named('jar', Jar).configure {
    from(project(':common').sourceSets.main.output)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

// Loom's production runner loads the distributable and Fabric API as JARs.
tasks.register('runReleaseClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = 'verification'
    description = 'Run the packaged Fabric mod in an isolated client instance.'
    runDir = layout.dir(providers.provider {
        project.file(providers.gradleProperty('mapiClientRunDir').getOrElse('build/release/client'))
    })
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    useXVFB = providers.gradleProperty('mapiUseXvfb').map { it.toBoolean() }.orElse(false)
}

tasks.register('runReleaseServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = 'verification'
    description = 'Run the packaged Fabric mod in an isolated dedicated server instance.'
    runDir = layout.dir(providers.provider {
        project.file(providers.gradleProperty('mapiServerRunDir').getOrElse('build/release/server'))
    })
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
