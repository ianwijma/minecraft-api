# minecraft-api — central Gradle properties.
#
# Project identity lives here; dependency/plugin versions live in gradle/libs.versions.toml.
# The Java package and Maven group below is a documented PLACEHOLDER: change it (plus
# dev/example/mapi package directories) before publishing under a real namespace.
# See docs/toolchain.md and AGENTS.md.

org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
# Fabric Loom is not yet configuration-cache compatible (fabric-loom issue #1349).
org.gradle.configuration-cache=false

# ---- Project identity (single source of truth) --------------------------------
# Maven group and base Java package. Placeholder: replace before publishing.
mapiGroup=dev.example.mapi
# Project version; also the mod version and the public API version for now.
mapiVersion=0.1.0
mapiName=Minecraft API
# Resource namespace, config file prefix, metadata id. Must be lowercase a-z0-9_-.
mapiModId=mapi
mapiDescription=MAPI: a small loader-neutral Java API for other mods plus an optional local HTTP API for external tools.
# Intentionally EMPTY: the project owner must fill this in. Do not invent authors.
mapiAuthors=
# Placeholder until the project owner selects a license (see LICENSE.pending.md).
mapiLicense=UNLICENSED

# ---- Java toolchain (pinned; see docs/toolchain.md) ----
javaVersion=25