name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "25"

jobs:
  sdk-checks:
    name: SDK generation, TypeScript smoke, and offline E2E harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test stdlib Python SDK against a loopback fake API
        run: python -m unittest discover -s sdk/python -p 'test_*.py'
      - name: Install generator YAML parser
        run: |
          python -m venv /tmp/mapi-sdk-venv
          /tmp/mapi-sdk-venv/bin/python -m pip install PyYAML
      - name: Check generated TypeScript SDK without writing files
        run: /tmp/mapi-sdk-venv/bin/python scripts/generate-sdks.py --check
      - name: Exercise TypeScript SDK against a loopback fake API
        run: /tmp/mapi-sdk-venv/bin/python scripts/ts-smoke.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Java SDK worker
        run: ./gradlew :sdk:apiWorkerJar --console=plain
      - name: Run offline E2E harness tests
        working-directory: e2e
        run: npm test

  verify:
    name: verify (format, tests, packaging, manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run core verification
        run: ./gradlew verify --stacktrace --console=plain
      - name: Upload test and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            common/build/reports/tests/
            common/build/test-results/
            fixture-mod/build/reports/tests/
            fixture-mod/build/test-results/
            sdk/build/reports/tests/
            sdk/build/test-results/
            build/reports/problems/
          if-no-files-found: ignore

  fabric:
    name: fabric artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :fabric:build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-api-fabric
          path: fabric/build/libs/*.jar

  neoforge:
    name: neoforge artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :neoforge:build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-api-neoforge
          path: neoforge/build/libs/*.jar

  consumer:
    name: public-API consumer example (against published artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to mavenLocal and build the consumer against it
        run: |
          ./gradlew publishLocal --console=plain
          ./gradlew :example-consumer:build -PmapiConsumerUseMavenLocal=true --console=plain

  context:
    name: llm context + doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew doctor llmContext --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: llm-context
          path: build/llm/CONTEXT.md
          if-no-files-found: ignore

  server-smoke:
    name: dedicated-server smoke test (EULA-gated, manual)
    runs-on: ubuntu-latest
    # Runs ONLY when the repository owner has explicitly opted in by setting
    # the repository VARIABLE MAPI_ACCEPT_EULA=true. Accepting Mojang's EULA
    # is an operator decision; CI never does it silently.
    if: ${{ vars.MAPI_ACCEPT_EULA == 'true' }}
    strategy:
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/server-smoke.sh ${{ matrix.loader }}
        env:
          MAPI_ACCEPT_EULA: "true"
          MAPI_SMOKE_TIMEOUT: "900"
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.loader }}
          path: |
            build/smoke/**/acceptance-report.json
            build/smoke/**/gradle-console.log
            build/smoke/**/logs/latest.log
          if-no-files-found: ignore

  packaged-smoke:
    name: packaged mod smoke (${{ matrix.loader }}, operator opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.MAPI_ACCEPT_EULA == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build packaged mod and profile preflight runner
        run: ./gradlew :${{ matrix.loader }}:build :runner:runnerJar --console=plain
      - name: Packaged dedicated server with authenticated HTTP and JAR provenance
        shell: bash
        run: |
          export MAPI_HTTP_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          scripts/server-smoke.sh ${{ matrix.loader }}
        env:
          MAPI_ACCEPT_EULA: "true"
          MAPI_HTTP_ENABLED: "true"
          MAPI_SMOKE_LAUNCH_MODE: release
          MAPI_SMOKE_TIMEOUT: "900"
      - name: Packaged client connection allowlist checks
        run: scripts/acceptance/connection-policy-smoke.sh ${{ matrix.loader }}
        env:
          MAPI_USE_XVFB: "true"
      - name: Packaged client and integrated-world house scenario
        run: scripts/acceptance/release-client-smoke.sh ${{ matrix.loader }}
        env:
          MAPI_USE_XVFB: "true"
      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-${{ matrix.loader }}
          path: |
            build/smoke/**/acceptance-report.json
            build/acceptance/**/report.json
            build/acceptance/**/summary.json
            build/acceptance/release-client/**/house/unstable-a.png
            build/acceptance/release-client/**/house/unstable-b.png
          if-no-files-found: ignore

  api-e2e:
    name: API corpus (${{ matrix.loader }}, ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAPI_MESA_VERSION: "25.2.8-0ubuntu0.24.04.2"
      MAPI_XVFB_VERSION: "2:21.1.12-1ubuntu1.8"
    if: ${{ vars.MAPI_ACCEPT_EULA == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
        sdk: [typescript, python, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned software rendering environment
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends "mesa-vulkan-drivers=$MAPI_MESA_VERSION" "libgl1-mesa-dri=$MAPI_MESA_VERSION" "xvfb=$MAPI_XVFB_VERSION"
      - name: Build release artifacts and acceptance fixtures
        run: ./gradlew :${{ matrix.loader }}:build :fixture-fabric:jar :fixture-neoforge:jar :sdk:apiWorkerJar --console=plain
      - name: Record rendering environment
        run: |
          mkdir -p build/api-coverage
          uname -a > build/api-coverage/rendering.txt
          dpkg-query -W xvfb libgl1-mesa-dri mesa-vulkan-drivers >> build/api-coverage/rendering.txt
          driver_path=$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json$')
          test "$(printf '%s\n' "$driver_path" | wc -l)" -eq 1
          test -f "$driver_path"
          echo "VK_ICD_FILENAMES=$driver_path" >> "$GITHUB_ENV"
          sha256sum "$driver_path" >> build/api-coverage/rendering.txt
      - name: Run complete corpus against fresh packaged games
        run: node --experimental-strip-types --no-warnings e2e/api/run.ts --loader ${{ matrix.loader }} --sdk ${{ matrix.sdk }}
        env:
          MAPI_ACCEPT_EULA: "true"
          MAPI_USE_XVFB: "true"
          LIBGL_ALWAYS_SOFTWARE: "true"
      - name: Upload first-attempt evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ matrix.loader }}-${{ matrix.sdk }}
          path: build/api-coverage/
          if-no-files-found: error

  api-coverage:
    name: Complete API coverage (required)
    runs-on: ubuntu-24.04
    if: always()
    needs: [api-e2e, verify, sdk-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require operator opt-in and successful prerequisites
        env:
          EULA_OPT_IN: ${{ vars.MAPI_ACCEPT_EULA }}
          CORPUS_RESULT: ${{ needs.api-e2e.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SDK_RESULT: ${{ needs.sdk-checks.result }}
        run: |
          test "$EULA_OPT_IN" = true || { echo 'Required API coverage blocked: set repository variable MAPI_ACCEPT_EULA=true after operator acceptance.'; exit 1; }
          test "$CORPUS_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$SDK_RESULT" = success
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: api-coverage-*
          path: build/api-coverage
      - name: Verify six complete behavior reports
        if: always()
        run: node --experimental-strip-types --no-warnings e2e/api/aggregate.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage-matrix
          path: build/api-coverage/matrix.json
          if-no-files-found: error
