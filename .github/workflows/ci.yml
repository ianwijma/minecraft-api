name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain verify
      - run: ./gradlew --console=plain publishLocal
      - run: ./gradlew --console=plain :example-consumer:build -PmapiConsumerUseMavenLocal=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributions
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  loader:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain :${{ matrix.loader }}:build
