openapi: 3.1.0
info:
  title: MAPI local HTTP API
  version: "1"
  description: >
    Read-only status API exposed by the MAPI Minecraft mod on loopback only.
    Requires a bearer token on every endpoint. Protocol version 1; see
    docs/http-api.md for lifecycle, limits, and error semantics.
servers:
  - url: http://127.0.0.1:25586
    description: default loopback listener (http.port, default 25586)
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness/auth check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Mod, API, Minecraft, platform versions, and session identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InfoResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/live:
    get:
      operationId: getLive
      summary: Process liveness (listener answers, independent of world state)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/ready:
    get:
      operationId: getReady
      summary: Readiness states (http, worldReady; clientJoined reserved)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/time:
    get:
      operationId: getTime
      summary: Process clocks plus server tick (explicit availability)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServerBusy" }
  /api/v1/server/status:
    get:
      operationId: getServerStatus
      summary: Read-only server status snapshot
      responses:
        "200":
          description: OK (running or not)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ServerNotRunning" }
                  - { $ref: "#/components/schemas/ServerStatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServerBusy" }
  /api/v1/server/players:
    get:
      operationId: getServerPlayers
      summary: Connected-player snapshots (paginated, field-selected)
      parameters:
        - { name: fields, in: query, schema: { type: string }, description: "comma-separated projection: name,id,dimension,position" }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/WrongState" }
        "503": { $ref: "#/components/responses/ServerBusy" }
  /api/v1/server/world/block:
    get:
      operationId: getServerBlock
      summary: Block read (loaded-only chunk policy)
      parameters:
        - { name: dimension, in: query, required: true, schema: { type: string } }
        - { name: x, in: query, required: true, schema: { type: integer } }
        - { name: y, in: query, required: true, schema: { type: integer } }
        - { name: z, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockResponse" }
        "404":
          description: Unknown dimension
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Chunk not loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/server/world/time:
    get:
      operationId: getServerWorldTime
      summary: World clocks for a dimension (26.2 time model)
      parameters:
        - { name: dimension, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorldTimeResponse" }
        "404":
          description: Unknown dimension
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks newest-first
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, running, succeeded, failed, cancelRequested, cancelled, expired] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskListResponse" }
    post:
      operationId: createTask
      summary: Submit a task (202 + Location; never shape-switches on speed)
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreateRequest" }
      responses:
        "202":
          description: Task accepted
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Idempotency-Key reused with a different body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      summary: Read one task snapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: cancelTask
      summary: Request cooperative cancellation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Task already finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/events:
    get:
      operationId: listEvents
      summary: Event cursor poll (per-process-session monotonic seq; explicit gap)
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 }, description: exclusive cursor }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventsResponse" }
  /api/v1/events/ticket:
    post:
      operationId: createEventTicket
      summary: Mint a single-use WebSocket ticket (30s TTL)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicketResponse" }
  /api/v1/client/status:
    get:
      operationId: getClientStatus
      summary: Local client snapshot (physical clients with registered ops only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientStatusResponse" }
        "409": { $ref: "#/components/responses/WrongState" }
        "503": { $ref: "#/components/responses/ServerBusy" }
  /api/v1/client/screen/tree:
    get:
      operationId: getClientScreenTree
      summary: Best-effort semantic widget tree of the open screen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreenTreeResponse" }
        "409": { $ref: "#/components/responses/WrongState" }
        "503": { $ref: "#/components/responses/ServerBusy" }
  /api/v1/client/screenshot:
    post:
      operationId: captureClientScreenshot
      summary: Capture the main framebuffer as PNG into mcapi/screenshots
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreenshotResponse" }
        "409": { $ref: "#/components/responses/WrongState" }
        "503": { $ref: "#/components/responses/ServerBusy" }
  /api/v1/client/input/key:
    post:
      operationId: pressClientKey
      summary: Input-mode key action through the game's key-mapping path
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyActionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyActionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/WrongState" }
        "503": { $ref: "#/components/responses/ServerBusy" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from MAPI_HTTP_TOKEN (preferred) or mapi.properties http.token.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Unexpected Host or Origin header
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Rate limit exceeded (Retry-After header present)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServerBusy:
      description: Server thread busy; snapshot timed out
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Invalid query, payload, or headers
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Unknown path or id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    WrongState:
      description: Operation requires an active server session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ProtocolVersioned:
      type: object
      required: [protocolVersion]
      properties:
        protocolVersion:
          type: integer
          const: 1
          description: HTTP protocol version; consumers must ignore unknown fields.
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [status]
          properties:
            status:
              type: string
              const: ok
    InfoResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [name, version, apiVersion, minecraftVersion, platform, platformVersion,
                     instanceId, processSessionId, physicalSide, availableLogicalSides]
          properties:
            name: { type: string, const: mapi }
            version: { type: string, description: MAPI mod version }
            apiVersion: { type: string, description: public Java API version }
            minecraftVersion: { type: string, example: "26.2" }
            platform: { type: string, enum: [fabric, neoforge] }
            platformVersion: { type: string, description: loader version string }
            instanceId:
              type: string
              description: sanitized http.instanceId value
            processSessionId:
              type: string
              description: unique per process launch
            worldSessionId:
              type: string
              description: >
                present only while a world/server session is active; changes
                when a world is opened, closed, or replaced
            physicalSide:
              type: string
              enum: [client, dedicatedServer]
              description: physical side of the process, not of the current session
            availableLogicalSides:
              type: array
              items: { type: string, enum: [client, server] }
              description: logical sides this process can currently serve
    LiveResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [live]
          properties:
            live: { type: boolean, const: true }
    ReadyResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [readiness, states]
          properties:
            readiness:
              type: string
              enum: [http, worldReady, clientJoined]
              description: coarse readiness; clientJoined is reserved for client operations
            states:
              type: object
              required: [http, worldReady, clientJoined]
              properties:
                http: { type: boolean, const: true }
                worldReady: { type: boolean }
                clientJoined: { type: boolean }
    TimeResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [wallClock, monotonicNanos, serverTick]
          properties:
            wallClock: { type: integer, format: int64, description: epoch milliseconds }
            monotonicNanos:
              type: integer
              format: int64
              description: process-local monotonic clock; do not compare across processes
            serverTick:
              oneOf:
                - type: object
                  required: [available, value]
                  properties:
                    available: { type: boolean, const: true }
                    value: { type: integer, format: int64, minimum: 0 }
                - type: object
                  required: [available, reason]
                  properties:
                    available: { type: boolean, const: false }
                    reason: { type: string, enum: [SERVER_NOT_RUNNING] }
                  description: unknown data is explicit, never empty
    ServerNotRunning:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [running]
          properties:
            running: { type: boolean, const: false }
    ServerStatusResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [running, capturedAtEpochMs, startedAtEpochMs, uptimeMs, playerCount, maxPlayers, tickCount, averageTickTimeMs, motd]
          properties:
            running: { type: boolean, const: true }
            capturedAtEpochMs: { type: integer, format: int64 }
            startedAtEpochMs: { type: integer, format: int64 }
            uptimeMs: { type: integer, format: int64 }
            playerCount: { type: integer, minimum: 0, description: count only; no identities }
            maxPlayers: { type: integer, minimum: 0 }
            tickCount: { type: integer, format: int64, minimum: 0 }
            averageTickTimeMs: { type: number, format: double, minimum: 0 }
            motd: { type: string, description: plain-text MOTD, empty when unavailable }
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, message, requestId]
              properties:
                code:
                  type: string
                  enum: [UNSUPPORTED, INVALID_JSON, INVALID_PAYLOAD, INVALID_QUERY, INVALID_HEADER,
                         UNAUTHORIZED, FORBIDDEN_HOST, FORBIDDEN_ORIGIN, NOT_FOUND, DIMENSION_NOT_FOUND,
                         METHOD_NOT_ALLOWED, WRONG_STATE, CHUNK_UNLOADED, PAYLOAD_TOO_LARGE,
                         IDEMPOTENCY_MISMATCH, RATE_LIMITED, SERVER_BUSY, INTERNAL]
                message: { type: string }
                requestId: { type: string }
    PlayersResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [dataVersion, players, total, limit, offset, truncated]
          properties:
            dataVersion: { type: integer, description: -1 when unavailable }
            players:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  id: { type: string, format: uuid }
                  dimension: { type: string }
                  position:
                    type: object
                    properties:
                      x: { type: number }
                      y: { type: number }
                      z: { type: number }
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
            truncated: { type: boolean }
    BlockResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [dataVersion, dimension, position, blockId, properties, policy]
          properties:
            dataVersion: { type: integer }
            dimension: { type: string }
            position:
              type: object
              properties:
                x: { type: integer }
                y: { type: integer }
                z: { type: integer }
            blockId: { type: string, example: "minecraft:stone" }
            properties: { type: object, additionalProperties: { type: string } }
            policy: { type: string, const: loadedOnly }
    WorldTimeResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [dimension, gameTime, overworldClockTime, defaultClockTime]
          properties:
            dimension: { type: string }
            gameTime: { type: integer, format: int64 }
            overworldClockTime: { type: integer, format: int64 }
            defaultClockTime: { type: integer, format: int64 }
    TaskCreateRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, example: wait-for-tick }
        payload: { type: object, additionalProperties: true }
        deadlineMs: { type: integer, format: int64 }
    TaskSnapshot:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [id, kind, state, createdAtEpochMs, deadlineEpochMs, partialEffects, cleanup]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string }
            state:
              type: string
              enum: [queued, running, succeeded, failed, cancelRequested, cancelled, expired]
            createdAtEpochMs: { type: integer, format: int64 }
            deadlineEpochMs: { type: integer, format: int64 }
            finishedAtEpochMs: { type: integer, format: int64 }
            progress:
              type: object
              properties:
                units: { type: integer, format: int64 }
                total: { type: integer, format: int64 }
                estimated: { type: boolean }
            result: { type: object, additionalProperties: true }
            partialEffects:
              type: array
              items: { type: object, additionalProperties: true }
            cleanup: { type: array, items: { type: string } }
            error:
              type: object
              properties:
                code: { type: string, enum: [INVALID_PAYLOAD, WRONG_STATE, DEADLINE_EXCEEDED, CANCELLED, LIFECYCLE_CHANGED, INTERNAL] }
                message: { type: string }
    TaskListResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [tasks, truncated, total]
          properties:
            tasks: { type: array, items: { $ref: "#/components/schemas/TaskSnapshot" } }
            truncated: { type: boolean }
            total: { type: integer }
    EventsResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [events, truncated, headSeq, oldestSeq]
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/EventObject" }
            truncated: { type: boolean }
            headSeq: { type: integer, format: int64 }
            oldestSeq: { type: integer, format: int64 }
            gap:
              type: object
              description: present when the requested cursor precedes retained history
              properties:
                from: { type: integer, format: int64 }
                to: { type: integer, format: int64 }
    EventObject:
      type: object
      required: [seq, eventType, source, wallClock, monotonicNanos, processSessionId, data]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string }
        source: { type: string, enum: [server-authoritative, client-observed, instrumented, mod-provided, api-originated] }
        wallClock: { type: integer, format: int64 }
        monotonicNanos: { type: integer, format: int64 }
        processSessionId: { type: string }
        worldSessionId: { type: string }
        data: { type: object, additionalProperties: true }
    EventTicketResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [ticket, expiresAtEpochMs, events]
          properties:
            ticket: { type: string }
            expiresAtEpochMs: { type: integer, format: int64 }
            events:
              type: object
              properties:
                scheme: { type: string, const: ws }
                host: { type: string, const: "127.0.0.1" }
                port: { type: integer }
    ClientStatusResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [window, guiScale, playerPresent]
          properties:
            window:
              type: object
              required: [width, height]
              properties:
                width: { type: integer }
                height: { type: integer }
            guiScale: { type: integer }
            currentScreenClass:
              type: string
              description: absent while the game HUD is showing
            playerPresent: { type: boolean }
            dimension: { type: string }
            gameTime: { type: integer, format: int64 }
    ScreenTreeResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [coverage, root]
          properties:
            coverage: { type: string, const: best-effort }
            root: { $ref: "#/components/schemas/ScreenNode" }
    ScreenNode:
      type: object
      properties:
        widgetClass: { type: string }
        label: { type: string }
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/ScreenNode" }
    KeyActionRequest:
      type: object
      required: [mapping, action]
      properties:
        mapping:
          type: string
          description: mapping name as reported by the client (e.g. key.forward)
        action: { type: string, enum: [press, release, tap] }
        mode: { type: string, const: input, description: input-mode only; other modes are rejected }
    KeyActionResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [mode, mapping, action]
          properties:
            mode: { type: string, const: input }
            mapping: { type: string }
            action: { type: string, enum: [press, release, tap] }
            isDown:
              type: boolean
              description: authoritative state after the action; absent for tap
    ScreenshotResponse:
      allOf:
        - $ref: "#/components/schemas/ProtocolVersioned"
        - type: object
          required: [frameId, path, width, height, bytes]
          properties:
            frameId: { type: integer, format: int64, description: monotonic per-process capture id }
            path: { type: string, description: relative to the instance game directory }
            width: { type: integer }
            height: { type: integer }
            bytes: { type: integer }