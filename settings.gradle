// minecraft-api — root settings file.
// Plugin versions are pinned in gradle/libs.versions.toml; do not use dynamic versions.

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
    }
}

plugins {
    // Lets Gradle auto-download the pinned JDK (see gradle/libs.versions.toml -> versions.java)
    // when the local machine does not have it installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'minecraft-api'

include 'common'
include 'harness'
include 'mcp-adapter'
include 'sdk:java'
include 'fabric'
include 'neoforge'
include 'example-consumer'